name: Build and Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'          # run on version tags
  workflow_dispatch:   # allows manual trigger

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux, win]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make gawk pkg-config zip
          if [ "${{ matrix.platform }}" = "win" ]; then
            sudo apt-get install -y mingw-w64
          else
            sudo apt-get install -y build-essential
          fi

      - name: Bootstrap Autotools
        run: ./bootstrap
      - name: Prepare build directories
        run: ./prepdirs

      - name: Configure
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
             cd build-win
             ../configure --with-platform=win
          else
              cd build-linux
            ../configure --with-platform=linux
          fi

      - name: Build
        run: make -j$(nproc)

      - name: Package binaries
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            zip -r tin-lia-win.zip tin-lia.exe libwin/libwin.a liblia/liblia.a
          else
            zip -r tin-lia-linux.zip tin-lia liblinux/liblinux.a liblia/liblia.a
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-binaries
          path: |
            tin-lia-linux.zip
            tin-lia-win.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: ./artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-binaries
          path: ./artifacts/win

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/linux/tin-lia-linux.zip
            artifacts/win/tin-lia-win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY }}
